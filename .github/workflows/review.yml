# Reusable workflow: the reviewer (`node cli/main.mjs review`). It reads one pull request
# with read-only tools and reports through a comment, a commit status and a level label.
#
# This file is a shell around the command line and holds no logic of its own. Called from
# the user's repository by templates/workflows/pipeline-review.yml, which only the dispatcher
# (or a person with write access) starts through workflow_dispatch.
#
# Security notes for whoever edits this file:
#   - Nothing from the event payload may appear in a `run:` script. The pull request number
#     reaches the engine through `env:` and the engine refuses anything that is not a whole number.
#   - This job never checks out the pull request's code with actions/checkout. The engine
#     fetches the merge ref into a separate temporary directory and the reviewer only reads it;
#     nothing from the pull request is executed.
#   - The default GITHUB_TOKEN is used for one thing: the two checkouts.
#   - Third-party actions: only actions/checkout and actions/setup-node, by major version tag.
#     A user who wants them pinned by commit SHA can fork this repository and pin them there.
name: review

on:
  workflow_call:
    inputs:
      engine_ref:
        description: "The ref of the engine to run. Pass the same ref as in `uses: ...@<ref>`: a reusable workflow cannot read its own ref."
        type: string
        required: true
      engine_repository:
        description: "The engine's repository (owner/name). Change it only when running a fork."
        type: string
        default: Tinghecui/coteam-pipeline
      app_id:
        description: "The id of the GitHub App the pipeline acts as (repository variable PIPELINE_APP_ID)."
        type: string
        required: true
      bot_login:
        description: "Optional (repository variable PIPELINE_BOT). The engine works out the login the App writes as by itself; logins given here, separated by commas, are trusted as authors of marks in addition to it."
        type: string
        default: ""
      claude_code_version:
        description: "The exact version of the Claude Code CLI (@anthropic-ai/claude-code) to install. Pinned: the engine is tested against this one."
        type: string
        default: "2.1.302"
      pr:
        description: "Pull request number."
        type: string
        required: true
      dry:
        description: "Run the reviewer but write nothing to GitHub or the ledger."
        type: boolean
        default: false
    secrets:
      PIPELINE_APP_KEY:
        description: "The private key (PEM) of the GitHub App."
        required: true
      ANTHROPIC_API_KEY:
        description: "The team's own Anthropic API key. The only credential the agent is given."
        required: true

# Read the two checkouts, nothing else. The verdict is written by the engine with the bot token.
permissions:
  contents: read

jobs:
  review:
    # Why this name, and why this job is dispatch-only:
    # the dispatcher counts every check run on a pull request's head as the repository's CI,
    # except the one named like the pipeline's own commit status (status_context, default
    # "pipeline/review"). The verdict of a review is that commit status and nothing else. If
    # this job ran on a pull request event, its check run "<caller job> / pipeline-review"
    # would sit on the pull request's head, and a reviewer that crashed (or was still running)
    # would be read as "CI failed" (or "CI pending") and send the pull request back for a
    # rework it does not need. Started by workflow_dispatch on the base branch, the check run
    # sits on a commit of the base branch instead, where no pull request's checks are read.
    # The name can never equal a status context either: GitHub always shows a called job as
    # "<caller job> / <this name>". Keep the trigger and the name as they are.
    name: pipeline-review
    runs-on: ubuntu-latest
    # A fixed ceiling, not the working limit: the engine stops the reviewer after
    # limits.reviewer_minutes (default 20).
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The base branch as dispatched, one commit. The engine fetches the pull request's
          # merge ref itself (200 commits deep, into a temporary directory) with the bot token.
          path: repo
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: engine
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Run the reviewer
        working-directory: repo
        env:
          PIPELINE_APP_ID: ${{ inputs.app_id }}
          PIPELINE_APP_KEY: ${{ secrets.PIPELINE_APP_KEY }}
          PIPELINE_BOT: ${{ inputs.bot_login }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR: ${{ inputs.pr }}
          DRY: ${{ inputs.dry }}
        run: node "$GITHUB_WORKSPACE/engine/cli/main.mjs" review --pr="$PR" --dry="$DRY"
